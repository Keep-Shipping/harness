[package]
name = "ks-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
ks-core.workspace = true
# `sha2` is rsa's own gate for `SigningKey<Sha256>`'s digest OID; the crate
# then re-exports the same sha2 0.10 the workspace already pins.
rsa = { version = "0.9", features = ["sha2"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true

[features]
# `decide` — the risk-answering step, off until the Jev adapter lands
# (#8) and its confidence has been calibrated against real plans (#108).
# The module always compiles; only `builtin_steps()` is gated on this, so a
# harness or a test can register `decide::Decide` without the feature.
decide = []

[dev-dependencies]
ks-lang.workspace = true
ks-testing.workspace = true

[lints]
workspace = true
