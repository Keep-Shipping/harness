# wasm-safety: ks-lang must not do I/O (nearest clippy.toml wins, so the root
# msrv setting is repeated here).
msrv = "1.98"

disallowed-methods = [
  "std::fs::canonicalize",
  "std::fs::copy",
  "std::fs::create_dir",
  "std::fs::create_dir_all",
  "std::fs::hard_link",
  "std::fs::metadata",
  "std::fs::read",
  "std::fs::read_dir",
  "std::fs::read_link",
  "std::fs::read_to_string",
  "std::fs::remove_dir",
  "std::fs::remove_dir_all",
  "std::fs::remove_file",
  "std::fs::rename",
  "std::fs::set_permissions",
  "std::fs::soft_link",
  "std::fs::symlink_metadata",
  "std::fs::write",
  "std::net::TcpListener::bind",
  "std::net::TcpStream::connect",
  "std::net::UdpSocket::bind",
  "std::net::UdpSocket::connect",
]

disallowed-types = [
  "std::fs::DirBuilder",
  "std::fs::DirEntry",
  "std::fs::File",
  "std::fs::OpenOptions",
  "std::fs::Permissions",
  "std::fs::ReadDir",
  "std::net::TcpListener",
  "std::net::TcpStream",
  "std::net::UdpSocket",
]
