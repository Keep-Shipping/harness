# The early-access waitlist Worker (issue #146). `wrangler deploy` from
# this directory; `wrangler d1 create` + `wrangler secret put` first (see
# the README). The D1 binding name and the rate limiter name are load-bearing
# in `src/lib.rs` (`Cloudflare::new().db("DB").rate_limiter("RATE_LIMITER")`).

name = "keepshipping-waitlist"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"

[build]
command = "worker-build --release"

[observability]
enabled = true

[vars]
ENV = "production"
# The console fleet view (issue #169) is fail-closed: until all three are
# set, /console/fleet answers 503. Fill them in and uncomment to switch it
# on. CONSOLE_EMAILS is the comma-separated allowlist (case-insensitive).
# CONSOLE_EMAILS = "ada@factory0.ventures"
# AUTH_ISSUER = "https://auth.factory0.ventures"
# AUTH_CLIENT_ID = "keepshipping-console"

# Edit as code (issue #170, docs/EDIT_AS_CODE.md): where the console's
# Terraform pull requests go. EDITS_REPO is `owner/name`; files land under
# EDITS_INFRA_DIR (empty = repository root) in the zone's module directory.
# The two secrets are NOT here — set them with:
#   wrangler secret put EDITS_GITHUB_TOKEN   # opens the pull requests
#   wrangler secret put EDITS_RUNNER_TOKEN   # the CI plan callback's Bearer
# Until EDITS_GITHUB_TOKEN exists the pages render but nothing delivers;
# the cron picks the queue up when the secret lands.
EDITS_REPO = "keepshipping/infra"
EDITS_BASE_BRANCH = "main"
EDITS_INFRA_DIR = ""
# The sign-in page the console's 401 links to (with ?return=… set).
# Empty/absent means the 401 page uses words instead of a link.
EDITS_SIGN_IN_URL = ""

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2001"

[ratelimits.simple]
limit = 30
period = 60

# The billing module's dispute poll (`DISPUTE_POLL_CRON` in `src/billing/`):
# Polar sends no dispute webhooks, so open, won and lost are read from its
# API here, hourly (issue #177, ADR 0202). The waitlist module's sweeps run
# on the same dispatch.
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "keepshipping-waitlist"
# Placeholder: replace with the id `wrangler d1 create keepshipping-waitlist`
# prints. Deploy must fail until a real database exists, not silently bind
# to someone else's.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# The console fleet view (issue #169): the nightly check writes the fleet
# snapshot here (key `fleet.json`), which /console/fleet renders.
[[kv_namespaces]]
binding = "FLEET"
# Placeholder: replace with the id `wrangler kv namespace create FLEET`
# prints, as with the D1 database above.
id = "00000000000000000000000000000000"

[[routes]]
pattern = "api.keepshipping.run"
custom_domain = true
