# The Keep Shipping console Worker: fleet view (#169), standard setup
# (#273), Search Console status (#274), plus the billing and waitlist
# modules. `wrangler deploy` from this directory; migrations and
# `wrangler secret put` first (see the README, "Deploy").
#
# Host: console.keepshipping.run. NOT api.keepshipping.run, and NOT the
# Worker name `keepshipping-waitlist`: both belong to the separate live
# waitlist Worker (Keep-Shipping/waitlist-backend). Reusing either would
# replace that Worker or take its host. The D1 binding name and the rate limiter name are load-bearing
# in `src/lib.rs` (`Cloudflare::new().db("DB").rate_limiter("RATE_LIMITER")`).

name = "keepshipping-console"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"

[build]
command = "worker-build --release"

[observability]
enabled = true

[vars]
ENV = "production"
# The console fleet view (issue #169) is fail-closed: until all three are
# set, /console/fleet answers 503. Fill them in and uncomment to switch it
# on. CONSOLE_EMAILS is the comma-separated allowlist (case-insensitive).
# CONSOLE_EMAILS = "ada@factory0.ventures"
# AUTH_ISSUER = "https://auth.factory0.ventures"
# AUTH_CLIENT_ID = "keepshipping-console"

[[ratelimits]]
name = "RATE_LIMITER"
# Account-wide on Factory0: 2001 is this venture's waitlist copy elsewhere
# and 1031 the live waitlist Worker; 2201 is unused on the account.
namespace_id = "2201"

[ratelimits.simple]
limit = 30
period = 60

# The billing module's dispute poll (`DISPUTE_POLL_CRON` in `src/billing/`):
# Polar sends no dispute webhooks, so open, won and lost are read from its
# API here, hourly (issue #177, ADR 0202). The waitlist module's sweeps run
# on the same dispatch.
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
# The console's own database on Factory0, created with
# `wrangler d1 create keepshipping-console`. Never the live waitlist's
# `keepshipping-waitlist` database: the two Workers share no data.
database_name = "keepshipping-console"
database_id = "b8f67c1f-9958-48f2-811b-1cc5b884c8d5"
migrations_dir = "migrations"

# The console fleet view (issue #169): the nightly check writes the fleet
# snapshot here (key `fleet.json`), which /console/fleet renders.
[[kv_namespaces]]
binding = "FLEET"
# Namespace `keepshipping-console-fleet` on Factory0.
id = "435eb12c7b7f41a9a7dac20b268293f2"

[[routes]]
pattern = "console.keepshipping.run"
custom_domain = true
