[package]
name = "keepshipping-waitlist"
description = "Keep Shipping's early-access waitlist: the hosted venture on the Cratefield harness waitlist module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
# `cdylib` is what `worker-build` compiles to wasm32 and deploys; `rlib`
# exists so the integration tests in `tests/` can import the crate.
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
cratefield-core = "0.8"
cratefield-mail-templates = "0.1"
cratefield-runtime-cloudflare = "0.4"
cratefield-module-waitlist = "0.4"
cratefield-adapter-owlpost = "0.2"
cratefield-adapter-polar = "0.2"
cratefield-adapter-resend = "0.4"
cratefield-adapter-turnstile = "0.3"
# The console fleet view's token verifier (issue #169), shared with the
# runtime's own `auth_from_env` wiring.
cratefield-auth-client = "0.3"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
# The setup change's files go to GitHub's contents API base64-encoded.
base64 = "0.23"
form_urlencoded = "1"
http = "1"
# The Search Console module signs its JWT assertion with the same flow the
# engine's `gsc.sitemap_submit` step uses; `sha2` is rsa's own gate for
# `SigningKey<Sha256>`'s digest OID.
rsa = { version = "0.9", features = ["sha2"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "macros"] }
tracing = "0.1"
worker = { version = "0.8.5", default-features = false, features = ["d1"] }

# ulid (through cratefield-core) draws its randomness from getrandom, whose
# wasm32 backend is opt-in per leaf crate. Never compiled on native targets.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }
# The Search Console module's `rsa` signs through rand 0.8, which is on the
# older getrandom — same opt-in under its old `js` name, same reason, so the
# worker still builds.
getrandom02 = { package = "getrandom", version = "0.2", default-features = false, features = ["js"] }

[dev-dependencies]
# `axum`/`tokio` serve the dev-only page server in `examples/gsc_dev.rs`;
# `async-trait` is what the example's permissive dev auth port needs.
async-trait = "0.1"
axum = { version = "0.8", features = ["tokio", "http1"] }
cratefield-adapter-sqlite = "0.3"
cratefield-testing = "0.5"
hmac = "0.13"
http = "1"
insta = "1"
# The mail guard reads the venture's vendored Factory Zero registry entry
# (#178): no "Sent with Owlpost" footer while Owlpost is not in it.
ks-core.workspace = true
pollster = "1.0"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tower = { version = "0.5", features = ["util"] }
