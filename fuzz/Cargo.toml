[package]
name = "harness-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Its own workspace root: the fuzz crate builds with nightly and libFuzzer and
# must never join the main workspace's stable merge gates.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
ks-lang = { path = "../crates/lang" }
ks-core = { path = "../crates/core" }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fmt"
path = "fuzz_targets/fmt.rs"
test = false
doc = false
bench = false
