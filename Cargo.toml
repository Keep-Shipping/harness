[workspace]
resolver = "3"
members = ["adapters/*", "crates/*", "ventures/keepshipping"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
repository = "https://github.com/Keep-Shipping/harness"

[workspace.dependencies]
ks-lang = { path = "crates/lang", version = "0.0.0" }
ks-core = { path = "crates/core", version = "0.0.0" }
ks-engine = { path = "crates/engine", version = "0.0.0" }
ks-cli = { path = "crates/cli", version = "0.0.0" }
ks-lsp = { path = "crates/lsp", version = "0.0.0" }
ks-testing = { path = "crates/testing", version = "0.0.0" }
ks-oci-distribution = { path = "adapters/oci-distribution", version = "0.0.0" }
ks-deno-script-host = { path = "adapters/deno-script-host", version = "0.0.0" }
serde = "1"
ed25519-dalek = { version = "3", default-features = false, features = ["zeroize"] }
sha2 = "0.11"
serde_json = "1"
serde_yaml_ng = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
