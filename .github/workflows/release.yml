name: Release

# A tag matching `v*` is the release trigger. ADR 0014:
# https://github.com/Keep-Shipping/harness/blob/main/docs/adr/0014-release-and-contract-versioning.md
# There is deliberately no workflow_dispatch: a dry run would build and
# sign artifacts that no tag names, and cosign keyless binds a signature to
# a workflow run rather than to a version. To rehearse a release, tag a
# commit on a scratch branch.
on:
  push:
    tags: ['v*']

# Two tags in a row: let the first finish rather than cancelling it halfway
# through a signing step.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Read-only at the top level, exactly like ci.yml. The one elevation a release
# needs — `contents: write`, to create the GitHub Release — is granted to the
# `publish` job alone, so a build or a compromised build step never holds a
# token that can rewrite the tag.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: keepshipping (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mach-O cannot be cross-linked from Linux without an Apple SDK, so
          # the darwin targets are built on a real macOS runner. `macos-latest`
          # is arm64 and `rustup target add` covers x86_64-apple-darwin from
          # it, which is the native toolchain on both.
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          # The two Linux targets cross-compile from Linux with `cross`.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.xz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.xz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show

      # No cargo build cache here, deliberately — unlike every ci.yml job. The
      # ci.yml jobs restore a cache that only ci.yml ever writes, so a pull
      # request can poison only its own build. This job is a tag push, and the
      # artifact it produces is what gets signed and published: a cache entry
      # written by an untrusted run and restored here would be shipped to every
      # user. A release build is slower without the cache and that is the
      # correct trade.

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Install cross for the Linux cross builds
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          # Pinned: `cross` chooses the container image it builds in, so an
          # unpinned install would let a new release change what a *release*
          # binary is compiled and linked against without the workflow
          # changing. The image digest is the next boundary.
          tool: cross@0.2.5

      - name: Install the target toolchain for ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }} \
            || { echo "::error::could not install the ${{ matrix.target }} std. Fix: check that the triple is spelled correctly and that 'rustup target add ${{ matrix.target }}' succeeds on a ${{ matrix.os }} runner."; exit 1; }

      - name: Build keepshipping
        shell: bash
        run: |
          set -euo pipefail
          # `cross` builds and runs the target's linker in a container, so it
          # drives the Linux builds; the darwin builds use plain cargo.
          build=(cargo build --release --locked -p ks-cli --bin keepshipping --target "${{ matrix.target }}")
          if [ "${{ runner.os }}" = "Linux" ]; then
            # `cross` replaces `cargo`, it does not wrap it: `cross build`, not
            # `cross cargo build` (which fails "no such command: `cargo`").
            build=(cross "${build[@]:1}")
          fi
          "${build[@]}" \
            || { echo "::error::the release build failed for ${{ matrix.target }}. Fix: run 'cargo build --release --locked -p ks-cli --bin keepshipping --target ${{ matrix.target }}' locally (with 'cross' for Linux targets) and fix the build before tagging."; exit 1; }

      - name: Archive keepshipping-${{ matrix.target }}
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          bin="target/${{ matrix.target }}/release/keepshipping"
          [ -x "$bin" ] \
            || { echo "::error::no keepshipping binary at '$bin'. Fix: check the '--bin keepshipping' name in crates/cli/Cargo.toml matches the build step."; exit 1; }
          out="keepshipping-${VERSION}-${{ matrix.target }}.${{ matrix.archive }}"
          stage="stage/keepshipping-${VERSION}"
          mkdir -p "$stage"
          cp "$bin" "$stage/keepshipping"
          # Keep Shipping ships LICENSE and README next to the binary so the
          # MIT licence (ADR 0016) travels with it.
          cp LICENSE README.md "$stage/" \
            || echo "::notice::LICENSE or README.md is missing from the tag; the archive carries the binary only."
          # .tar.gz on macOS, .tar.xz on Linux: the two platforms disagree about
          # which is native, and each platform should not need a foreign tool
          # to unpack its own release.
          tar -C stage -czf "$out" "keepshipping-${VERSION}" \
            || { echo "::error::could not build the tar.gz for ${{ matrix.target }}. Fix: check that 'tar -czf' works on a ${{ matrix.os }} runner."; exit 1; }
          if [ "${{ matrix.archive }}" = "tar.xz" ]; then
            rm -f "$out"
            tar -C stage -cJf "$out" "keepshipping-${VERSION}" \
              || { echo "::error::could not build the tar.xz for ${{ matrix.target }}. Fix: check that 'tar -cJf' works on a ${{ matrix.os }} runner."; exit 1; }
          fi
          # `path:` in the upload step is expanded by Actions, not by the shell,
          # so the version has to cross the step boundary as a step output
          # rather than as a shell variable.
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "archive=$out" >> "$GITHUB_OUTPUT"

      # CycloneDX SBOM for the `keepshipping` binary: every crate that went
      # into it, with versions and licences, so a user can answer "what is in
      # this release" without trusting us. One per target, because the
      # dependency set is resolved per `--target` and the two Linux cross
      # builds do not share one.
      - name: SBOM for ${{ matrix.target }}
        shell: bash
        # The version comes from the tag, so it crosses into the script through
        # the environment rather than through `${{ }}`: an expression is
        # substituted into the script text before bash ever parses it, which
        # would make a tag name that reads as shell its way to execution. `env`
        # is the same string either way and is not code.
        env:
          VERSION: ${{ steps.archive.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          base="keepshipping-${VERSION}-${TARGET}"
          # `--override-filename` sets the basename cargo-cyclonedx writes; it
          # writes one file per workspace member into that member's directory,
          # so the ks-cli copy is the one describing the release binary.
          cargo cyclonedx --format json \
            --target "$TARGET" \
            --override-filename "$base" \
            || { echo "::error::cargo cyclonedx failed for ${TARGET}. Fix: run 'cargo cyclonedx --format json --target ${TARGET}' locally in crates/cli and repair the SBOM before tagging."; exit 1; }
          mv "crates/cli/$base.json" "$base.cdx.json"
          # The other workspace members' SBOMs are the same crates resolved from
          # a different root; only the binary's own SBOM ships.
          find . -name "$base.json" ! -path "./$base.cdx.json" -delete
          test -s "$base.cdx.json" \
            || { echo "::error::no SBOM at '$base.cdx.json'. Fix: check that 'cargo cyclonedx' writes to crates/cli/ and that --override-filename still names the file in cargo-cyclonedx 0.5.9."; exit 1; }
          echo "wrote $base.cdx.json"

      - name: Upload the archive and its SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keepshipping-${{ matrix.target }}
          # The exact names the Archive and SBOM steps wrote, for every matrix
          # entry: keepshipping-<version>-<target>.<archive> and
          # keepshipping-<version>-<target>.cdx.json. The SBOM travels with the
          # archive as its own asset so the release job can fold it into
          # SHA256SUMS and the cosign signature covers it.
          path: |
            keepshipping-${{ steps.archive.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
            keepshipping-${{ steps.archive.outputs.version }}-${{ matrix.target }}.cdx.json
          if-no-files-found: error
          retention-days: 7

  checksums-and-sign:
    name: SHA256SUMS and cosign signature
    needs: release
    runs-on: ubuntu-latest
    permissions:
      # `cosign sign-blob` with no key is keyless: it mints an OIDC identity for
      # this run, and minting that token requires `id-token: write`. The SLSA
      # provenance attestation below is signed by Sigstore over that same OIDC
      # token and stored in GitHub's attestation store, which needs
      # `attestations: write`. Both are granted here and not at the top level,
      # so no other job gets an OIDC token it does not need.
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download every archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: keepshipping-*
          merge-multiple: true

      - name: Write one SHA256SUMS, sorted by filename
        run: |
          shopt -s nullglob
          # 4 archives and the 4 SBOMs that sit beside them: 8 entries, so a
          # missing SBOM fails the release rather than shipping unsigned
          # provenance alongside signed binaries.
          files=(dist/*.tar.gz dist/*.tar.xz dist/*.cdx.json)
          ((${#files[@]} == 8)) \
            || { echo "::error::expected 4 archives and 4 SBOMs (8 files), found ${#files[@]}: ${files[*]}. Fix: check the release matrix covers every target, that each 'Upload the archive and its SBOM' step ran, and that the SBOM step wrote keepshipping-<version>-<target>.cdx.json for every target."; exit 1; }
          names=()
          for f in "${files[@]}"; do names+=("${f#dist/}"); done
          # Sorted so the file is byte-identical for identical inputs, which
          # is what lets a user re-derive and compare it. xargs -0 rather than
          # `sha256sum $(…)`: no filename is ever word-split, so a name with a
          # space could not smuggle in a second argument.
          ( cd dist && printf '%s\0' "${names[@]}" | sort -z | xargs -0 sha256sum > SHA256SUMS ) \
            || { echo "::error::could not write SHA256SUMS. Fix: check that 'sha256sum' is on PATH on ubuntu-latest."; exit 1; }
          cat dist/SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the checksums with cosign keyless
        # Keyless: the signature carries the OIDC identity of this workflow
        # run, so the release needs no long-lived cosign key and a user
        # verifies with 'cosign verify-blob --certificate-identity ...'.
        # Both outputs: the .sig/.pem pair for `cosign verify-blob`, and the
        # .bundle (signature + certificate + transparency-log proof) for
        # `cosign verify-blob --bundle`.
        #
        # Signing SHA256SUMS rather than each archive is what makes one
        # verification cover the whole release: SHA256SUMS now names the four
        # archives *and* their four SBOMs, so the signature reaches the SBOMs
        # too. cosign v2.6.1 (the version cosign-installer v3.10.1 pins by
        # default) writes and reads this bundle unchanged:
        #
        #   cosign verify-blob --bundle SHA256SUMS.bundle \
        #     --certificate-identity \
        #       https://github.com/Keep-Shipping/harness/.github/workflows/release.yml@refs/tags/<tag> \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     SHA256SUMS
        run: |
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            --bundle dist/SHA256SUMS.bundle \
            dist/SHA256SUMS \
            || { echo "::error::cosign keyless signing failed. Fix: check that the 'checksums-and-sign' job still has 'id-token: write' in its permissions block (without it GitHub mints no OIDC token and cosign cannot sign), and that the sigstore Fulcio/Rekor endpoints are reachable from the runner."; exit 1; }

      # Prove the documented verification command works before anything is
      # published, rather than discovering on release day that it does not. This
      # is the exact command the workflow comment above tells a user to run,
      # with the two placeholders resolved.
      #
      # The repository and ref come in through `env`, not `${{ }}`: both are
      # interpolated into the identity string, and `env` keeps them data rather
      # than shell text before bash parses the script.
      - name: Verify the signature the way a user would
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # cosign prints the subject digest and the certificate identity it
          # matched on success; keep that in the log so a later reader can see
          # what was verified without re-running anything.
          cosign verify-blob \
            --bundle dist/SHA256SUMS.bundle \
            --certificate-identity "https://github.com/${REPOSITORY}/.github/workflows/release.yml@${REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS \
            || { echo "::error::the signature did not verify against this run's own identity. Fix: check that the cosign version (v2.6.1, from cosign-installer) reads the bundle written by 'cosign sign-blob --bundle' unchanged, and that '--certificate-identity' above names the workflow path and ref GitHub actually put in the Fulcio certificate."; exit 1; }

      - name: Attest the build provenance of SHA256SUMS
        # SLSA provenance: a signed statement, from this workflow run, of what
        # was built and by which workflow file. The subject is SHA256SUMS
        # itself rather than each archive, so one attestation covers the whole
        # release and `gh attestation verify <archive> --repo …` resolves
        # through the checksums. Stored in GitHub's attestation store, where
        # `gh attestation verify` reads it without any key from us.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload the checksums and the signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: |
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
            dist/SHA256SUMS.bundle
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [release, checksums-and-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # --verify-tag below needs the tag; full history keeps it simple.
          fetch-depth: 0

      - name: Download every archive plus the signed checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          # Two patterns, one per line: the per-target archives and SBOMs are
          # uploaded as `keepshipping-<target>`, but SHA256SUMS and its
          # signature are uploaded as `checksums`. A single `keepshipping-*`
          # would silently skip them and the release would have nothing signed
          # to attach.
          pattern: |
            keepshipping-*
            checksums
          merge-multiple: true

      - name: Create the release
        # `gh`, which the runner already has, rather than a third-party action:
        # the release path should carry no dependency we do not pin ourselves.
        # `gh` authenticates from GH_TOKEN, which the workflow supplies, so the
        # checkout above still keeps `persist-credentials: false`.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `--verify-tag` so the release can only be cut from a tag that is
          # already on the remote, never from a commit that merely looks like
          # one.
          #
          # The notes come from GitHub's own release-notes generator
          # (`--generate-notes`), which summarises the merged pull requests and
          # conventional commits since the previous tag — the same source
          # release-plz would read.
          #
          # There is no release-plz step: every package is `publish = false`,
          # so it had nothing to do, and on v0.1.0 it still failed for want of
          # a GITHUB_TOKEN. Add it back, with a token, the day a crate is
          # published.
          #
          # The SBOMs ride along as their own assets, named for the archive
          # they describe. SHA256SUMS names them too, so the cosign signature
          # and the SLSA provenance attestation both cover them.
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.tar.xz dist/*.cdx.json dist/SHA256SUMS dist/SHA256SUMS.bundle)
          ((${#assets[@]} == 10)) \
            || { echo "::error::expected 10 release assets (4 archives, 4 SBOMs, SHA256SUMS and its bundle), found ${#assets[@]}: ${assets[*]}. Fix: check the release matrix covers every target, that each 'Upload the archive and its SBOM' step ran, and that the 'Upload the checksums and the signature' step ran."; exit 1; }
          gh release create "$TAG" \
            --verify-tag \
            --title "keepshipping $TAG" \
            --generate-notes \
            "${assets[@]}" \
            || { echo "::error::'gh release create' failed. Fix: check that the 'publish' job still has 'contents: write' in its permissions block (without it the token cannot create a release), and read the API error above."; exit 1; }
