name: Nightly

on:
  schedule:
    # Daily at 03:17 UTC — off-peak for both Europe and the US.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (10 min)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly (minimal profile)
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup run nightly rustc --version

      - name: Restore the cargo build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          # Pinned for the same reason as cargo-deny in ci.yml: the fuzzer's
          # flags and defaults move between releases, and the `--target` on the
          # run below is written against this version.
          tool: cargo-fuzz@0.13.2

      - name: Seed the corpus from the test fixtures
        run: |
          mkdir -p fuzz/corpus/parse fuzz/corpus/fmt
          cp crates/lang/tests/fixtures/*.ks fuzz/corpus/parse/
          cp crates/lang/tests/fixtures/*.ks fuzz/corpus/fmt/

      # --target x86_64-unknown-linux-gnu: cargo-fuzz 0.13 defaults to static
      # musl, where the address sanitizer cannot link.
      - name: Fuzz the parser for 10 minutes
        run: |
          cargo +nightly fuzz run parse --target x86_64-unknown-linux-gnu -- -max_total_time=600 \
            || { echo "::error::The fuzzer found a failure (crash, timeout or broken invariant). Fix: download the fuzz-artifacts upload, reproduce with 'cargo +nightly fuzz run parse --target x86_64-unknown-linux-gnu <artifact>', minimise it, and fix the root cause."; exit 1; }

      - name: Fuzz the formatter for 2 minutes
        run: |
          cargo +nightly fuzz run fmt --target x86_64-unknown-linux-gnu -- -max_total_time=120 \
            || { echo "::error::The fuzzer found a failure (crash, timeout or broken invariant). Fix: download the fuzz-artifacts upload, reproduce with 'cargo +nightly fuzz run fmt --target x86_64-unknown-linux-gnu <artifact>', minimise it, and fix the root cause."; exit 1; }

      - name: Upload fuzzing artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  bench:
    name: bench (500-line parse under 5 ms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show

      - name: Restore the cargo build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: benchmark
        run: |
          cargo bench -p ks-lang \
            || { echo "::error::The parse benchmark exceeded its 5 ms budget for a 500-line file. Fix: run 'cargo bench -p ks-lang' locally, profile the regression, and bring the median back under budget."; exit 1; }
