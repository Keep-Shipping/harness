name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  workflow-lint:
    name: workflow lint (actionlint, zizmor, shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Every tool pinned to an exact version, and every download checked
      # against the publisher's own checksum, so the lint cannot change under
      # a workflow nobody reviewed. install-action fetches from GitHub Releases
      # and verifies each checksum itself; actionlint is not one of the tools
      # it knows, so it is fetched below against the checksum its release
      # publishes.
      - name: Install zizmor and shellcheck
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: |
            zizmor@1.30.1
            shellcheck@0.10.0

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          # From actionlint's published actionlint_${version}_checksums.txt at
          # the same tag. Bump all three together.
          sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "${sha256}  actionlint.tar.gz" | sha256sum --check --strict \
            || { echo "::error::the actionlint tarball does not match its published checksum. Fix: do not retry — treat it as a tampered download or a changed release, and re-derive the digest from https://github.com/rhysd/actionlint/releases/tag/v${version}."; exit 1; }
          tar xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: actionlint
        run: |
          actionlint -color \
            || { echo "::error::actionlint rejected the workflows. Fix: run 'actionlint' locally, read the line it names, and repair the YAML or the shell in it."; exit 1; }

      - name: zizmor
        # `--offline` so the audit needs no token and behaves identically on a
        # pull request from a fork, where no secret is available. The default
        # persona is `regular` and zizmor exits non-zero on any finding it
        # reports, so a new unpinned `uses:` fails this job rather than merging.
        run: |
          zizmor --offline --no-progress . \
            || { echo "::error::zizmor found a workflow supply-chain problem. Fix: run 'zizmor --offline .' locally, follow the audit link it prints, and either repair the workflow or, if the finding is genuinely a false positive, suppress that one rule inline with '# zizmor: ignore[rule]' and a reason."; exit 1; }

      - name: shellcheck install.sh
        # Only the one shell script we own. The `run:` blocks in the workflows
        # are already covered: actionlint extracts each one and hands it to
        # shellcheck itself, so a second pass here would say the same things
        # twice.
        run: |
          shellcheck -x install.sh \
            || { echo "::error::shellcheck rejected install.sh. Fix: run 'shellcheck -x install.sh' locally and repair what it names."; exit 1; }

  gates:
    name: gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show

      - name: Restore the cargo build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-deny
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          # Pinned: cargo-deny's config schema moves between releases, so an
          # unpinned install makes this gate fail on a dependency bump rather
          # than on anything in the graph. Bump it in the same PR that
          # deliberately moves deny.toml.
          tool: cargo-deny@0.20.2

      - name: rustfmt
        run: |
          cargo fmt --all --check \
            || { echo "::error::rustfmt found unformatted code. Fix: run 'cargo fmt --all' and commit the result."; exit 1; }

      - name: clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings \
            || { echo "::error::clippy found violations. Fix: run 'cargo clippy --workspace --all-targets -- -D warnings' locally and clear every warning."; exit 1; }

      - name: tests
        run: |
          cargo test --workspace \
            || { echo "::error::tests failed. Fix: run 'cargo test --workspace' locally, make it pass, and commit."; exit 1; }

      - name: docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps \
            || { echo "::error::rustdoc found broken intra-doc links or other warnings. Fix: run 'RUSTDOCFLAGS=\"-D warnings\" cargo doc --workspace --no-deps' locally and repair the docs."; exit 1; }

      - name: cargo-deny
        run: |
          cargo deny check \
            || { echo "::error::cargo-deny rejected the dependency graph (licence, source, duplicate or advisory). Fix: run 'cargo deny check' locally and follow its report."; exit 1; }

  wasm:
    name: wasm-safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show

      - name: Restore the cargo build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Keep ks-lang and ks-core free of non-workspace dependencies
        shell: bash
        run: |
          if ! graph=$(cargo tree -p ks-lang -p ks-core -e normal --target wasm32-unknown-unknown --prefix none); then
            echo "::error::'cargo tree' failed to resolve the workspace. Fix: check the Cargo.toml dependency declarations."
            exit 1
          fi
          names=$(printf '%s\n' "$graph" | sed -E 's/ v[0-9].*$//' | grep -v '^$' | sort -u || true)
          echo "wasm32-unknown-unknown dependency graph of ks-lang and ks-core:"
          echo "$names"
          violations=$(printf '%s\n' "$names" | grep -vE '^(ks-lang|ks-core)$' || true)
          if [ -n "$violations" ]; then
            echo "::error::ks-lang/ks-core are not wasm-safe: non-workspace dependencies found. Fix: keep both crates free of external dependencies (no tokio/mio/socket2/async-std) and free of std::fs/std::net."
            echo "Offending entries:"
            echo "$violations"
            exit 1
          fi

      - name: Build ks-lang and ks-core for wasm32-unknown-unknown
        run: |
          cargo build -p ks-lang -p ks-core --target wasm32-unknown-unknown \
            || { echo "::error::wasm32-unknown-unknown build failed. Fix: run 'cargo build -p ks-lang -p ks-core --target wasm32-unknown-unknown' locally; ks-lang and ks-core must stay I/O-free (no std::fs, no std::net, no tokio)."; exit 1; }

  offline:
    name: check needs no network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show

      - name: Restore the cargo build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the CLI
        run: cargo build -p ks-cli

      - name: Check the fixtures inside a network namespace with no interfaces
        run: |
          # `check` reads files and must never reach for anything else. In a
          # namespace with no interfaces a connection attempt fails fast
          # (ENETUNREACH), so reaching at all would abort the run with an
          # unexpected result; the `timeout` catches hangs. The fixtures
          # carry intentional errors, so exit 1 is the one acceptable
          # outcome.
          rc=0
          # `sudo … > file` redirects as the *unprivileged* outer shell anyway,
          # so the output is piped through tee instead: it lands in the file
          # and still reaches the job log, and `rc` comes from the keepshipping
          # run rather than from tee.
          sudo unshare --net -- timeout 60 ./target/debug/keepshipping check --all \
            crates/cli/tests/fixtures | tee /tmp/offline-check.out || rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 1 ]; then
            echo "::error::expected exit 1 (the fixtures' diagnostics), got $rc. Fix: keep 'keepshipping check' free of network access and store reads; it may only read the files it checks."
            exit 1
          fi
          grep -q "expected oci.Digest, got oci.Tag" /tmp/offline-check.out \
            || { echo "::error::the fixtures were not actually checked."; exit 1; }

  registry-conformance:
    name: registry conformance (zot, distribution)
    runs-on: ubuntu-latest
    services:
      # zot v2.1.22 — native `/v2/<name>/referrers`, exercised on the native path.
      zot:
        image: ghcr.io/project-zot/zot-linux-amd64:v2.1.22@sha256:46f688dc26315a35a247e1784368829e66a67bf91de94c7d8d1645044fac1d5b
        ports:
          - "5001:5000"
      # distribution 2.8.3 — no `/v2/<name>/referrers`, so the adapter falls
      # back to the `sha256-<hex>` tag schema.
      distribution:
        image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - "5002:5000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show

      - name: Restore the cargo build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Wait for both registries to answer the v2 API
        run: |
          # Both images serve plain HTTP on :5000 out of the box, anonymous.
          # `/v2/` answering 200 is the readiness signal; give each one a
          # bounded window rather than a fixed sleep.
          for port in 5001 5002; do
            ready=0
            for _ in $(seq 1 60); do
              if curl -sf "http://localhost:${port}/v2/" > /dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "::error::the registry on localhost:${port} never answered /v2/ within 60s. Fix: check the service image, or the ports mapped above."
              exit 1
            fi
            echo "localhost:${port} is answering /v2/"
          done

      - name: Run the Registry conformance kit against both
        env:
          KS_OCI_CONFORMANCE_REGISTRIES: localhost:5001,localhost:5002
        run: |
          cargo test -p ks-oci-distribution --test conformance -- --nocapture \
            || { echo "::error::the Registry conformance kit failed. Fix: run 'KS_OCI_CONFORMANCE_REGISTRIES=localhost:5001,localhost:5002 cargo test -p ks-oci-distribution --test conformance' against local zot and distribution, make it pass, and commit."; exit 1; }

      - name: Publish and read a block back off both registries
        env:
          KS_OCI_CONFORMANCE_REGISTRIES: localhost:5001,localhost:5002
        run: |
          cargo test -p ks-cli --test blocks_registry -- --nocapture \
            || { echo "::error::the blocks publish round trip failed. Fix: run 'KS_OCI_CONFORMANCE_REGISTRIES=localhost:5001,localhost:5002 cargo test -p ks-cli --test blocks_registry' against local zot and distribution, make it pass, and commit."; exit 1; }

  script-runtime:
    name: script runtime (pinned Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show

      - name: Restore the cargo build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Restore the pinned Deno
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/keepshipping/deno
          key: deno-${{ runner.os }}-2.9.7-x86_64-unknown-linux-gnu
          # A different pinned version still restores: the download is verified
          # against the compiled-in digest either way, so a stale cache is a
          # miss the installer replaces, not a wrong binary it runs.
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Run the ScriptHost conformance kit and the sandbox refusals on real Deno
        env:
          KS_DENO_CONFORMANCE: "1"
        run: |
          cargo test -p ks-deno-script-host --test conformance -- --nocapture \
            || { echo "::error::the Deno script host failed. Fix: run 'KS_DENO_CONFORMANCE=1 cargo test -p ks-deno-script-host' locally, make it pass, and commit."; exit 1; }

  bench:
    name: check budget (cold 1 s, warm p95 100 ms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show

      - name: Restore the cargo build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Bench the check path against its budget
        run: |
          cargo bench -p ks-cli --bench check \
            || { echo "::error::the check budget is blown (cold 1 s, warm p95 100 ms). Fix: run 'cargo bench -p ks-cli --bench check' locally, read the numbers, and make the check path fast again before adding anything to it."; exit 1; }
