# Dependabot keeps the pins in .github/workflows fresh. Every `uses:` in this
# repository is pinned to a 40-character commit SHA (issue #116), which means
# nothing in a workflow moves unless a human or this file says so — Dependabot
# is how it gets said.
#
# Every ecosystem below carries the same `cooldown: default-days: 7` on top of
# the weekly schedule: most of what these publish is not worth a maintainer's
# attention on the day it appears, and a same-day bump to an action is exactly
# the shape of supply-chain attack the SHA pins exist to blunt.
version: 2

updates:
  # Rust. The workspace, including adapters/ and ventures/ through the root
  # manifest. Grouped below so a bump to a shared dependency arrives as one
  # reviewable PR rather than twenty.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:17"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      cargo-dependencies:
        applies-to: version-updates
        patterns:
          - "*"

  # The GitHub Actions themselves. This is the update that unpins nothing: each
  # PR rewrites a SHA to the newer commit and updates its `# vX.Y.Z` comment,
  # which is exactly the edit the pinning comment in each workflow asks for.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:17"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"

  # The TypeScript SDK.
  - package-ecosystem: npm
    directory: /sdk/ts
    schedule:
      interval: weekly
      day: monday
      time: "04:17"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      npm-sdk-dependencies:
        applies-to: version-updates
        patterns:
          - "*"

  # The VS Code extension.
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
      day: monday
      time: "04:17"
    # Seven days between a version landing upstream and Dependabot opening a
    # PR for it, on top of the weekly schedule. Most of what these ecosystems
    # publish is not worth a maintainer's attention on the day it appears, and
    # a same-day bump to an action is exactly the shape of the supply-chain
    # attack the SHA pins exist to blunt.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      npm-editors-dependencies:
        applies-to: version-updates
        patterns:
          - "*"