# cargo-deny configuration (schema version 2). Run: cargo deny check
# This workspace has no external dependencies yet; the lists below are the
# permissive licences we expect to accumulate over time.

[licenses]
version = 2

allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSD-Source-Code",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

# Workspace crates are MIT (ADR 0016) and unpublished
# (publish = false), so they are checked against the allow list above too.
private = { ignore = false }

confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies keep their own version, not a wildcard req.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
version = 2
# RUSTSEC-2023-0071: signing-only use, no decryption, no upstream fix, engine step gsc.sitemap_submit (#274).
# RUSTSEC-2024-0449: unsafe-libyaml is unmaintained (archived), not vulnerable; it
# comes in through serde_yaml_ng, which has no maintained-backend release yet.
# Revisit when serde_yaml_ng moves off it.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2024-0449"]
